<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой вишлист на Новый год</title>
<style>
:root{--bg:#fbf6f1;--card:#fff;--ink:#2b2230;--mute:#7a6f80;--line:#eadfd6;--acc:#c0392b;--accink:#fff;--ok:#2f7d5b;--okbg:#e4f3ec;--busy:#f1ece8}
@media (prefers-color-scheme:dark){:root{--bg:#1b161e;--card:#261f2b;--ink:#f3ecf5;--mute:#a99eb0;--line:#3a3141;--acc:#e5604f;--accink:#1b161e;--ok:#6fcf9f;--okbg:#1f3a2e;--busy:#2f2735}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:clamp(26px,6vw,36px);margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 22px}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card.taken{background:var(--busy)}
.card.taken img{filter:grayscale(1);opacity:.6}
.card.taken .t{text-decoration:line-through;color:var(--mute)}
.card img{width:100%;max-height:320px;object-fit:cover;display:block}
.body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px}
.t{font-weight:600;font-size:17px;word-break:break-word}
.price,.note{color:var(--mute);font-size:14px}
a{color:var(--acc)}
.badge{display:inline-block;font-size:13px;border-radius:999px;padding:3px 10px;background:var(--okbg);color:var(--ok)}
.badge.busy{background:var(--line);color:var(--mute)}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer}
button.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:20px;display:grid;gap:8px}
.panel h2{margin:0;font-size:16px}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.empty,.msg{text-align:center;color:var(--mute);padding:30px 0}
.foot{margin-top:40px;text-align:center;font-size:13px}
.foot a{color:var(--mute);cursor:pointer}
</style>
</head>
<body>
<main>
<h1>🎄 Мой вишлист на Новый год</h1>
<p class="sub">Выбери подарок и нажми «Подарю это», чтобы никто другой не купил то же самое. Кто именно дарит — я не вижу, так что сюрприз сохранится.</p>
<div id="admin"></div>
<div id="list" class="grid"><div class="msg">Загружаю…</div></div>
<div class="foot"><a id="loginLink">Вход для владельца</a></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== ВСТАВЬ СВОИ ДАННЫЕ ИЗ SUPABASE (Project Settings → API) ======
const SUPABASE_URL = "https://xpimofzkyqqndrjuvgcc.supabase.co";
const SUPABASE_KEY = "sb_publishable_MhmqBVQSpDAAWZQY6jrliA__vyuyIKZ";
// ======================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const listEl = document.getElementById('list'), adminEl = document.getElementById('admin');
let gifts = [], isOwner = false;

// токен этого браузера, чтобы друг мог отменить только свою бронь
const token = localStorage.getItem('wl_token') || (() => { const t = crypto.randomUUID(); localStorage.setItem('wl_token', t); return t; })();
const mine = new Set(JSON.parse(localStorage.getItem('wl_mine') || '[]'));
const saveMine = () => localStorage.setItem('wl_mine', JSON.stringify([...mine]));

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function safeUrl(u){ u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; try{ new URL(u); return u; }catch(e){ return ''; } }

async function load(){
  const { data, error } = await sb.from('gifts_public').select('*').order('created_at');
  if (error) { listEl.innerHTML = '<div class="msg">Не удалось загрузить список. Проверь настройки Supabase.</div>'; return; }
  gifts = data; render();
}

function render(){
  if (!gifts.length) { listEl.innerHTML = '<div class="empty">' + (isOwner ? 'Пока пусто — добавь первый подарок выше.' : 'Вишлист пока пуст, загляни позже 🙂') + '</div>'; return; }
  listEl.innerHTML = gifts.map(g => {
    const taken = g.reserved && !isOwner, my = mine.has(g.id) && g.reserved, u = safeUrl(g.url);
    let a = '';
    if (isOwner) a = `<button data-x="${g.id}" data-img="${esc(g.image_url||'')}">Удалить</button>`;
    else if (!g.reserved) a = `<span class="badge">Свободно</span><button class="main" data-r="${g.id}">Подарю это 🎁</button>`;
    else if (my) a = `<span class="badge">Ты даришь это ✓</span><button data-c="${g.id}">Отменить</button>`;
    else a = `<span class="badge busy">Уже кто-то дарит</span>`;
    return `<div class="card${taken ? ' taken' : ''}">${g.image_url ? `<img src="${esc(g.image_url)}" alt="" loading="lazy">` : ''}
      <div class="body"><div class="row"><div class="t">${esc(g.title)}</div>${g.price ? `<div class="price">${esc(g.price)}</div>` : ''}</div>
      ${g.note ? `<div class="note">${esc(g.note)}</div>` : ''}
      ${u ? `<div><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Ссылка на подарок ↗</a></div>` : ''}
      <div class="actions">${a}</div></div></div>`;
  }).join('');
}

listEl.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  b.disabled = true;
  if (b.dataset.r) {
    const { data } = await sb.rpc('reserve_gift', { p_id: b.dataset.r, p_token: token });
    if (data) { mine.add(b.dataset.r); saveMine(); } else alert('Увы, этот подарок только что забронировал кто-то другой.');
  } else if (b.dataset.c) {
    await sb.rpc('cancel_gift', { p_id: b.dataset.c, p_token: token });
    mine.delete(b.dataset.c); saveMine();
  } else if (b.dataset.x) {
    if (!confirm('Удалить этот подарок из списка?')) { b.disabled = false; return; }
    await sb.from('gifts').delete().eq('id', b.dataset.x);
    const m = (b.dataset.img || '').split('/gift-images/')[1];
    if (m) await sb.storage.from('gift-images').remove([decodeURIComponent(m)]);
  }
  load();
});

// ---------- владелец ----------
async function resizeImage(file){
  const img = await createImageBitmap(file), max = 1000, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

function showAdmin(){
  adminEl.innerHTML = `<div class="panel"><h2>Добавить подарок</h2>
    <input id="n_t" placeholder="Название *" maxlength="120"><input id="n_u" placeholder="Ссылка (необязательно)">
    <input id="n_p" placeholder="Примерная цена (необязательно)" maxlength="30"><input id="n_c" placeholder="Комментарий: размер, цвет… (необязательно)" maxlength="200">
    <input id="n_i" type="file" accept="image/*"><button class="main" id="n_b">Добавить в вишлист</button>
    <button id="n_o">Выйти</button></div>`;
  document.getElementById('n_o').onclick = async () => { await sb.auth.signOut(); isOwner = false; adminEl.innerHTML = ''; render(); };
  document.getElementById('n_b').onclick = async function(){
    const t = document.getElementById('n_t').value.trim(); if (!t) { document.getElementById('n_t').focus(); return; }
    this.disabled = true;
    let image_url = null; const f = document.getElementById('n_i').files[0];
    if (f) {
      const path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
      const { error } = await sb.storage.from('gift-images').upload(path, await resizeImage(f), { contentType: 'image/jpeg' });
      if (error) { alert('Не удалось загрузить фото: ' + error.message); this.disabled = false; return; }
      image_url = sb.storage.from('gift-images').getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from('gifts').insert({ title: t, url: document.getElementById('n_u').value.trim(), price: document.getElementById('n_p').value.trim(), note: document.getElementById('n_c').value.trim(), image_url });
    if (error) alert('Не удалось добавить: ' + error.message);
    else ['n_t','n_u','n_p','n_c','n_i'].forEach(i => document.getElementById(i).value = '');
    this.disabled = false; load();
  };
}

document.getElementById('loginLink').onclick = async () => {
  if (isOwner) return;
  const email = prompt('Email владельца:'); if (!email) return;
  const password = prompt('Пароль:'); if (!password) return;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) alert('Не удалось войти: ' + error.message);
  else { isOwner = true; showAdmin(); render(); }
};

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) { isOwner = true; showAdmin(); }
  load();
  setInterval(load, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
