<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вишлисты на Новый год</title>
<style>
:root{--bg:#fbf6f1;--card:#fff;--ink:#2b2230;--mute:#7a6f80;--line:#eadfd6;--acc:#c0392b;--accink:#fff;--ok:#2f7d5b;--okbg:#e4f3ec;--busy:#f1ece8}
@media (prefers-color-scheme:dark){:root{--bg:#1b161e;--card:#261f2b;--ink:#f3ecf5;--mute:#a99eb0;--line:#3a3141;--acc:#e5604f;--accink:#1b161e;--ok:#6fcf9f;--okbg:#1f3a2e;--busy:#2f2735}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:clamp(24px,5vw,34px);margin:0 0 18px}
.layout{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
@media(max-width:720px){.layout{grid-template-columns:1fr}}
aside{display:grid;gap:12px}
.people{display:flex;flex-direction:column;gap:6px}
@media(max-width:720px){.people{flex-direction:row;flex-wrap:wrap}}
.tab{text-align:left;display:flex;justify-content:space-between;gap:8px;width:100%}
@media(max-width:720px){.tab{width:auto}}
.tab.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.tab small{opacity:.7}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card.taken{background:var(--busy)}
.card.taken img{filter:grayscale(1);opacity:.6}
.card.taken .t{text-decoration:line-through;color:var(--mute)}
.card img{width:100%;max-height:320px;object-fit:cover;display:block}
.body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px}
.t{font-weight:600;font-size:17px;word-break:break-word}
.price,.note,.sub{color:var(--mute);font-size:14px}
h2{margin:0 0 4px;font-size:22px}
a{color:var(--acc)}
.badge{display:inline-block;font-size:13px;border-radius:999px;padding:3px 10px;background:var(--okbg);color:var(--ok)}
.badge.busy{background:var(--line);color:var(--mute)}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer}
button.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0;display:grid;gap:8px}
.panel h3{margin:0;font-size:16px}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.empty,.msg{text-align:center;color:var(--mute);padding:30px 0}
.err{color:var(--acc);font-size:14px}
.who{font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<h1>🎄 Вишлисты на Новый год</h1>
<div class="layout">
 <aside>
  <div id="people" class="people"></div>
  <div id="auth"></div>
 </aside>
 <section>
  <div id="head"></div>
  <div id="admin"></div>
  <div id="list" class="grid"><div class="msg">Загружаю…</div></div>
 </section>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://xpimofzkyqqndrjuvgcc.supabase.co";
const SUPABASE_KEY = "sb_publishable_MhmqBVQSpDAAWZQY6jrliA__vyuyIKZ";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const BOOK = 'my-bookings';
let partners = {};
let user = null, profiles = [], gifts = [], sel = null, authMode = null;

// токен этого браузера, чтобы друг мог отменить только свою бронь
const token = localStorage.getItem('wl_token') || (() => { const t = crypto.randomUUID(); localStorage.setItem('wl_token', t); return t; })();
const mine = new Set(JSON.parse(localStorage.getItem('wl_mine') || '[]'));
const saveMine = () => localStorage.setItem('wl_mine', JSON.stringify([...mine]));

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function safeUrl(u){ u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; try{ new URL(u); return u; }catch(e){ return ''; } }
const isMe = () => user && sel === user.id;

async function load(){
  const [p, g] = await Promise.all([
    sb.from('profiles').select('*').order('created_at'),
    sb.from('gifts_public').select('*').order('created_at')
  ]);
  if (p.error || g.error) { $('list').innerHTML = '<div class="msg">Не удалось загрузить данные. Проверь настройки Supabase.</div>'; return; }
  profiles = p.data; gifts = g.data;
  const pr = await sb.rpc('my_partners', { p_token: token }); partners = {};
  (pr.data || []).forEach(r => { (partners[r.gift_id] = partners[r.gift_id] || []).push(r.name); });
  let ch = false; mine.forEach(id => { if (!gifts.some(x => x.id === id && x.reserved_count > 0)) { mine.delete(id); ch = true; } }); if (ch) saveMine();
  if (!sel || (sel !== BOOK && !profiles.some(x => x.id === sel))) {
    const fromHash = location.hash.slice(1);
    sel = (fromHash === BOOK || profiles.some(x => x.id === fromHash)) ? fromHash : (user && profiles.some(x => x.id === user.id) ? user.id : (profiles[0] && profiles[0].id) || null);
  }
  renderPeople(); renderHead(); renderList();
}

function renderPeople(){
  const sorted = [...profiles].sort((a, b) => (user && b.id === user.id) - (user && a.id === user.id));
  const bookN = gifts.filter(g => mine.has(g.id)).length;
  const bookTab = `<button class="tab${sel === BOOK ? ' on' : ''}" data-p="${BOOK}"><span>🎁 Мои брони</span><small>${bookN}</small></button>`;
  $('people').innerHTML = bookTab + sorted.map(p => {
    const n = gifts.filter(g => g.owner_id === p.id).length;
    return `<button class="tab${p.id === sel ? ' on' : ''}" data-p="${p.id}"><span>${p.id === (user && user.id) ? '★ ' : ''}${esc(p.name)}</span><small>${n}</small></button>`;
  }).join('') || '<div class="sub">Пока никто не создал вишлист.</div>';
}

function renderHead(){
  if (sel === BOOK) { $('head').innerHTML = '<h2>Мои брони</h2><p class="sub">Подарки, которые ты решил(а) подарить. Список хранится в этом браузере.</p>'; return; }
  const p = profiles.find(x => x.id === sel);
  if (!p) { $('head').innerHTML = '<div class="msg">Создай свой вишлист слева — и он появится здесь 🎁</div>'; return; }
  $('head').innerHTML = `<h2>${isMe() ? 'Мой вишлист' : 'Вишлист: ' + esc(p.name)}</h2>
   <p class="sub">${isMe() ? 'Ты не видишь, кто что бронирует — так сюрприз сохранится. Друзьям можно отправить ссылку на эту страницу.' : 'Нажми «Подарю это», чтобы никто другой не купил то же самое.'}</p>`;
}

function partnersLine(id){ const n = partners[id] || []; return n.length ? `<div class="note">👥 Дарите вместе с: <b>${esc(n.join(', '))}</b></div>` : ''; }
function counter(g){ return g.max_people > 1 ? `<div class="note">Забронировали: ${g.reserved_count} из ${g.max_people}</div>` : ''; }
function cardHtml(g, extra, actions, taken){
  const u = safeUrl(g.url);
  return `<div class="card${taken ? ' taken' : ''}">${g.image_url ? `<img src="${esc(g.image_url)}" alt="" loading="lazy">` : ''}
    <div class="body">${extra}<div class="row"><div class="t">${esc(g.title)}</div>${g.price ? `<div class="price">${esc(g.price)}</div>` : ''}</div>
    ${g.note ? `<div class="note">${esc(g.note)}</div>` : ''}
    ${u ? `<div><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Ссылка на подарок ↗</a></div>` : ''}
    ${actions.pre || ''}<div class="actions">${actions.btns}</div></div></div>`;
}
function renderList(){
  if (sel === BOOK) {
    const b = gifts.filter(g => mine.has(g.id));
    $('list').innerHTML = b.length ? b.map(g => {
      const pr = profiles.find(x => x.id === g.owner_id);
      return cardHtml(g, `<div class="who">🎁 Для: <b>${esc(pr ? pr.name : '—')}</b></div>`,
        { pre: counter(g) + partnersLine(g.id), btns: `<button data-p="${g.owner_id}">Открыть вишлист</button><button data-c="${g.id}">Отменить бронь</button>` }, false);
    }).join('') : '<div class="empty">Пока ничего не забронировано. Выбери вишлист друга и нажми «Подарю это».</div>';
    return;
  }
  const list = gifts.filter(g => g.owner_id === sel), own = isMe();
  if (!sel) { $('list').innerHTML = ''; return; }
  if (!list.length) { $('list').innerHTML = '<div class="empty">' + (own ? 'Пока пусто — добавь первый подарок выше.' : 'Здесь пока ничего нет 🙂') + '</div>'; return; }
  $('list').innerHTML = list.map(g => {
    const my = mine.has(g.id) && g.reserved_count > 0, taken = g.reserved && !own && !my;
    let btns = '', pre = '';
    if (own) { btns = `<button data-x="${g.id}" data-img="${esc(g.image_url || '')}">Удалить</button>`; if (g.max_people > 1) pre = `<div class="note">Можно дарить вместе: до ${g.max_people} чел.</div>`; }
    else {
      pre = counter(g) + (my ? partnersLine(g.id) : '');
      if (my) btns = `<span class="badge">Ты даришь это ✓</span><button data-c="${g.id}">Отменить</button>`;
      else if (g.reserved) btns = `<span class="badge busy">${g.max_people > 1 ? 'Все места заняты' : 'Уже кто-то дарит'}</span>`;
      else btns = `<span class="badge">${g.reserved_count ? 'Есть свободные места' : 'Свободно'}</span><button class="main" data-r="${g.id}">${g.max_people > 1 ? 'Подарю вместе 🎁' : 'Подарю это 🎁'}</button>`;
    }
    return cardHtml(g, '', { pre, btns }, taken);
  }).join('');
}

function getName(){
  if (user) { const me = profiles.find(p => p.id === user.id); return me ? me.name : (user.email || 'Друг').split('@')[0]; }
  let n = localStorage.getItem('wl_name');
  if (!n) {
    n = (prompt('Как тебя подписать? Имя увидят только те, кто дарит этот подарок вместе с тобой.') || '').trim().slice(0, 40);
    if (!n) return null;
    localStorage.setItem('wl_name', n);
  }
  return n;
}

function select(id){ sel = id; history.replaceState(null, '', '#' + id); renderPeople(); renderHead(); renderAdmin(); renderList(); }
$('people').addEventListener('click', e => { const b = e.target.closest('button'); if (b) select(b.dataset.p); });

$('list').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) { select(b.dataset.p); return; }
  b.disabled = true;
  if (b.dataset.r) {
    const nm = getName(); if (nm === null) { b.disabled = false; return; }
    const { data } = await sb.rpc('reserve_gift', { p_id: b.dataset.r, p_token: token, p_name: nm });
    if (data) { mine.add(b.dataset.r); saveMine(); } else alert('Увы, все места на этот подарок уже заняты.');
  } else if (b.dataset.c) {
    await sb.rpc('cancel_gift', { p_id: b.dataset.c, p_token: token });
    mine.delete(b.dataset.c); saveMine();
  } else if (b.dataset.x) {
    if (!confirm('Удалить этот подарок из списка?')) { b.disabled = false; return; }
    await sb.from('gifts').delete().eq('id', b.dataset.x);
    const m = (b.dataset.img || '').split('/gift-images/')[1];
    if (m) await sb.storage.from('gift-images').remove([decodeURIComponent(m)]);
  }
  load();
});

// ---------- добавление подарков ----------
async function resizeImage(file){
  const img = await createImageBitmap(file), k = Math.min(1, 1000 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

function renderAdmin(){
  if (!isMe()) { $('admin').innerHTML = ''; return; }
  $('admin').innerHTML = `<div class="panel"><h3>Добавить подарок</h3>
    <input id="n_t" placeholder="Название *" maxlength="120"><input id="n_u" placeholder="Ссылка (необязательно)">
    <input id="n_p" placeholder="Примерная цена (необязательно)" maxlength="30"><input id="n_c" placeholder="Комментарий: размер, цвет… (необязательно)" maxlength="200">
    <label class="sub" for="n_m">Сколько человек могут подарить это вместе (1 — один человек):</label><input id="n_m" type="number" min="1" max="20" value="1"><input id="n_i" type="file" accept="image/*"><button class="main" id="n_b">Добавить в вишлист</button>
    <button id="n_n">Изменить моё имя</button></div>`;
  $('n_n').onclick = async () => {
    const me = profiles.find(p => p.id === user.id), name = (prompt('Как тебя подписать?', me ? me.name : '') || '').trim();
    if (!name) return;
    const { error } = await sb.from('profiles').update({ name }).eq('id', user.id);
    if (error) alert('Не удалось сохранить: ' + error.message); else load();
  };
  $('n_b').onclick = async function(){
    const t = $('n_t').value.trim(); if (!t) { $('n_t').focus(); return; }
    this.disabled = true;
    let image_url = null; const f = $('n_i').files[0];
    if (f) {
      const path = user.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
      const { error } = await sb.storage.from('gift-images').upload(path, await resizeImage(f), { contentType: 'image/jpeg' });
      if (error) { alert('Не удалось загрузить фото: ' + error.message); this.disabled = false; return; }
      image_url = sb.storage.from('gift-images').getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from('gifts').insert({ title: t, url: $('n_u').value.trim(), price: $('n_p').value.trim(), note: $('n_c').value.trim(), image_url, owner_id: user.id, max_people: Math.min(20, Math.max(1, parseInt($('n_m').value) || 1)) });
    if (error) alert('Не удалось добавить: ' + error.message);
    else { ['n_t','n_u','n_p','n_c','n_i'].forEach(i => $(i).value = ''); $('n_m').value = 1; }
    this.disabled = false; load();
  };
}

// ---------- вход и регистрация ----------
function renderAuth(){
  if (user) {
    $('auth').innerHTML = '<button id="a_out">Выйти</button>';
    $('a_out').onclick = () => sb.auth.signOut();
    return;
  }
  if (!authMode) {
    $('auth').innerHTML = '<div class="actions"><button class="main" id="a_reg">Создать свой вишлист</button><button id="a_in">Войти</button></div>';
    $('a_reg').onclick = () => { authMode = 'reg'; renderAuth(); };
    $('a_in').onclick = () => { authMode = 'in'; renderAuth(); };
    return;
  }
  const reg = authMode === 'reg';
  $('auth').innerHTML = `<div class="panel"><h3>${reg ? 'Новый вишлист' : 'Вход'}</h3>
    ${reg ? '<input id="a_n" placeholder="Твоё имя (его увидят друзья)" maxlength="40">' : ''}
    <input id="a_e" type="email" placeholder="Email"><input id="a_p" type="password" placeholder="Пароль (от 6 символов)">
    <div id="a_m" class="err"></div>
    <button class="main" id="a_go">${reg ? 'Создать' : 'Войти'}</button><button id="a_x">Отмена</button></div>`;
  $('a_x').onclick = () => { authMode = null; renderAuth(); };
  $('a_go').onclick = async function(){
    const email = $('a_e').value.trim(), password = $('a_p').value, name = reg ? $('a_n').value.trim() : '';
    const msg = $('a_m'); msg.textContent = '';
    if (!email || !password || (reg && !name)) { msg.textContent = 'Заполни все поля.'; return; }
    this.disabled = true;
    const r = reg ? await sb.auth.signUp({ email, password, options: { data: { name } } }) : await sb.auth.signInWithPassword({ email, password });
    this.disabled = false;
    if (r.error) { msg.textContent = r.error.message; return; }
    if (reg && !r.data.session) { msg.style.color = 'var(--ok)'; msg.textContent = 'Почти готово! Подтверди email по ссылке из письма и войди.'; }
    else authMode = null;
  };
}

async function ensureProfile(){
  if (!user) return;
  const { data } = await sb.from('profiles').select('id').eq('id', user.id);
  if (data && !data.length) {
    const name = (user.user_metadata && user.user_metadata.name) || (user.email || 'Друг').split('@')[0];
    await sb.from('profiles').insert({ id: user.id, name });
  }
}

sb.auth.onAuthStateChange(async (event, session) => {
  user = session ? session.user : null;
  setTimeout(async () => {
    await ensureProfile();
    if (user && (event === 'SIGNED_IN')) sel = user.id;
    renderAuth(); await load(); renderAdmin();
  }, 0);
});

(async () => {
  const { data } = await sb.auth.getSession();
  user = data.session ? data.session.user : null;
  renderAuth(); await load(); renderAdmin();
  setInterval(load, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && id !== sel && (id === BOOK || profiles.some(p => p.id === id))) select(id); });
})();
</script>
</body>
</html>
